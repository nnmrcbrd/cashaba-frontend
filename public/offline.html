<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#073f30" />
    <title>Offline · Casha-Ba</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f9f8; color: #112b23; font-family: system-ui, sans-serif; }

      p { line-height: 1.6; color: #52635c; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 22px; color: white; background: #076447; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Reconnect to view your accounts and financial records. Casha-Ba does not save private account data for offline access.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
