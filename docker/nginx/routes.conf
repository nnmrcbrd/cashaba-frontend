location = /_nginx-health {
    access_log off;
    return 200 'OK\n';
    add_header Content-Type text/plain;
}
location / {
    set $web_upstream frontend:3000;
    proxy_pass http://$web_upstream$request_uri;
    # Preserve Next.js streaming and its own cache-control headers.
    proxy_buffering off;
}
